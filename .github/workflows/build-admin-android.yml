name: Build Admin Android APK

on:
  push:
    branches:
      - master
    paths:
      - "unique-youths-admin/**"
      - ".github/workflows/build-admin-android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unique-youths-admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: unique-youths-admin/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"   # ✅ Capacitor requires Java 21

      - uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor and assets generator
        run: |
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli @capacitor/assets

      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.BACKEND_API_URL }}
          VITE_CLIENT_URL: ${{ vars.CLIENT_APP_URL }}

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from "@capacitor/cli";

          const config: CapacitorConfig = {
            appId: "com.uniqueyouths.admin",
            appName: "Unique Youth Admin",
            webDir: "dist",
            server: {
              url: process.env.ADMIN_APP_URL,
              cleartext: false
            }
          };

          export default config;
          EOF

      - name: Add Android platform (if not exists)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists, skipping add."
          fi

      - name: Copy icon for asset generation
        run: |
          mkdir -p assets
          cp public/assets/icon.png assets/icon.png

      - name: Generate Android assets (icons & splash)
        run: npx capacitor-assets generate

      - name: Sync Capacitor Android project
        run: npx cap sync android
        env:
          ADMIN_APP_URL: ${{ vars.ADMIN_APP_URL }}

      # ✅ NEW: Upgrade Gradle wrapper to a version that supports Java 21
      - name: Upgrade Gradle wrapper
        working-directory: unique-youths-admin/android
        run: |
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.10

      - name: Decode signing keystore (if configured)
        id: signing
        working-directory: unique-youths-admin/android
        run: |
          if [ -n "${{ secrets.ADMIN_ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ADMIN_ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.has_keystore == 'true'
        working-directory: unique-youths-admin/android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ADMIN_ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ADMIN_ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ADMIN_ANDROID_KEY_PASSWORD }}"
          mkdir -p ../apk-output
          cp app/build/outputs/apk/release/app-release.apk ../apk-output/unique-youths-admin.apk

      - name: Build debug APK (no signing secrets configured)
        if: steps.signing.outputs.has_keystore == 'false'
        working-directory: unique-youths-admin/android
        run: |
          echo "::warning::No ADMIN_ANDROID_KEYSTORE_BASE64 secret set - building a debug-signed APK instead of a release-signed one. See the comment at the top of this workflow file for how to add proper signing."
          ./gradlew assembleDebug
          mkdir -p ../apk-output
          cp app/build/outputs/apk/debug/app-debug.apk ../apk-output/unique-youths-admin.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: unique-youths-admin-apk
          path: unique-youths-admin/apk-output/unique-youths-admin.apk

      - name: Update Release Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -d latest-admin-android || true
          git push origin :refs/tags/latest-admin-android || true
          git tag latest-admin-android
          git push origin latest-admin-android --force
        working-directory: .

      - name: Publish to "latest-admin-android" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-admin-android
          name: Latest Admin Android build
          body: Automatically built from the latest master branch. Downloaded via the admin app download link.
          prerelease: false
          files: unique-youths-admin/apk-output/unique-youths-admin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}